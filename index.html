<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141a2e">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>2mese és alvás</title>
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="2mese és alvás">
<style>
:root{--bg:#fff7ec;--card:#fff;--tx:#3b2f2f;--sub:#8a7a7a;--pri:#ff8a5c;--green:#2e9e4f;--hl:#e6f7ea}
body.night{--bg:#16120f;--card:#231c16;--tx:#f0dcc0;--sub:#a8927a;--pri:#e0894a;--green:#9bd17a;--hl:#2d2a1c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);transition:.3s}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px}
h1{margin:0;font-size:24px}
button{font:inherit;cursor:pointer;border:0}
.round{width:46px;height:46px;border-radius:50%;background:var(--card);font-size:22px;box-shadow:0 3px 10px #0002}
main{padding:0 16px 90px;max-width:760px;margin:auto}
.search{width:100%;padding:14px 18px;border-radius:30px;border:2px solid #0001;background:var(--card);color:var(--tx);font:inherit;margin-bottom:14px}
.hero{border-radius:28px;padding:22px;color:#fff;display:flex;gap:16px;align-items:center;margin-bottom:16px;box-shadow:0 6px 18px #0003;cursor:pointer}
.hero .e{font-size:64px}.hero small{opacity:.9}.hero b{font-size:20px;display:block}
.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.chip{padding:10px 18px;border-radius:30px;background:var(--card);color:var(--tx);white-space:nowrap;box-shadow:0 2px 6px #0002}
.chip.on{background:var(--pri);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{border-radius:24px;overflow:hidden;background:var(--card);box-shadow:0 4px 12px #0002;cursor:pointer}
.card .img{height:110px;display:grid;place-items:center;font-size:56px}
.card .t{padding:10px 12px 14px;font-weight:700;font-size:15px}.card .t small{display:block;color:var(--sub);font-weight:400}
.reader{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:env(safe-area-inset-top) 0 120px;display:none}
.reader.open{display:block}
.cover{height:200px;display:grid;place-items:center;font-size:96px;border-radius:0 0 40px 40px}
.story{max-width:700px;margin:auto;padding:18px;font-size:calc(21px * var(--fs,1));line-height:1.75}
.story h2{font-size:26px}
.w{border-radius:6px;padding:0 1px;transition:color .2s}
.w.r{color:var(--green);font-weight:700}
.w.now{background:var(--hl)}
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:700px;margin:auto;background:var(--card);border-radius:36px;box-shadow:0 6px 24px #0004;display:flex;align-items:center;gap:8px;padding:10px 14px}
.play{width:56px;height:56px;border-radius:50%;background:var(--pri);color:#fff;font-size:24px}
.bar select,.bar input{flex:1;min-width:0}
.top{position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;z-index:3}
.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:9}
.modal.open{display:grid}
.box{background:var(--card);border-radius:28px;padding:24px;text-align:center;max-width:300px}
#qr{display:grid;place-items:center;background:#fff;padding:12px;border-radius:16px;margin:12px 0}
html,body{overscroll-behavior:none}
body.lock{overflow:hidden}
.reader{height:100dvh;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-top:calc(64px + env(safe-area-inset-top))}
.chips{overscroll-behavior-x:contain;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.wrap{position:relative;width:300px;max-width:100%;margin:10px auto}
.wrap canvas{width:100%;height:auto;display:block}
.ptr{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:34px;color:#e53935;z-index:2;filter:drop-shadow(0 2px 2px #0006)}
#wres{min-height:92px;margin:6px 0 10px;font-weight:700}
#wres .e{font-size:48px;animation:pop .5s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.card{contain:layout paint;content-visibility:auto;contain-intrinsic-size:150px 190px;-webkit-tap-highlight-color:transparent}
.reader,.chips{will-change:scroll-position}
#wc{will-change:transform;transform:translateZ(0)}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:620px;margin:auto;display:flex;background:var(--card);border-radius:34px;box-shadow:0 6px 24px #0004;padding:6px;z-index:5}
.nav button{flex:1;background:none;color:var(--tx);font-size:22px;padding:6px 0;border-radius:26px;display:flex;flex-direction:column;align-items:center;min-height:56px}
.nav button small{font-size:11px;color:var(--sub)}.nav button:active{background:var(--hl)}
.reader{z-index:6}main{padding-bottom:120px}
.end{text-align:center;margin:30px 0 90px}.end .chip{margin:6px;font-size:17px;padding:14px 22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));background:#333;color:#fff;padding:12px 20px;border-radius:26px;z-index:20;font-size:15px;opacity:0;pointer-events:none;transition:.3s;max-width:90%;text-align:center}
.toast.on{opacity:1}#upd.spin{animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
body.night .card .img,body.night .hero,body.night .cover{filter:brightness(.62) saturate(.7)}
body.night #wc{filter:brightness(.72) saturate(.8)}
body.night .story{line-height:1.9}
body.night *{box-shadow:none!important}
.install{position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));max-width:620px;margin:auto;background:var(--card);border-radius:24px;box-shadow:0 6px 24px #0005!important;padding:12px 14px;display:none;align-items:center;gap:10px;z-index:8}
.install.on{display:flex}.install div{flex:1;font-size:15px}.install small{display:block;color:var(--sub)}
.install .chip{background:var(--pri);color:#fff}.install .x{background:none;color:var(--sub);font-size:20px}
</style>
</head>
<body>
<header><div style="display:flex;align-items:center;gap:12px"><img src="icon-192.png" alt="" width="46" height="46" style="border-radius:14px;box-shadow:0 3px 10px #0004"><div><h1>2mese és alvás</h1><small style="color:var(--sub)">Esti mesék 3–6 éveseknek</small></div></div><button class="round" id="upd" title="Frissítés">🔄</button></header>
<main>
 <div class="hero" id="daily"></div>
 <input class="search" id="q" placeholder="🔍 Mese keresése…">
 <div class="chips" id="chips"></div>
 <div class="grid" id="grid"></div>
</main>

<section class="reader" id="reader">
 <div class="top"><button class="chip" id="back">← Vissza</button><span><button class="round" id="share">🔗</button> <button class="round" id="fs">Aa</button> <button class="round" id="x">✕</button></span></div>
 <div class="cover" id="cover"></div>
 <article class="story" id="story"></article>
 <div class="bar"><button class="play" id="play">▶</button>
  <button class="chip" id="sl" title="Alvásidőzítő">😴</button><select id="voice" title="Hang"></select>
  <input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="0.85" title="Sebesség"></div>
</section>

<div class="install" id="install"><img src="icon-192.png" width="44" height="44" style="border-radius:12px" alt=""><div><b>Telepítsd: 2mese és alvás</b><small>Offline is működik, ikon a kezdőképernyőn</small></div><button class="chip" id="instBtn">Telepítés</button><button class="x" id="instX">✕</button></div>
<div class="modal" id="iosm"><div class="box"><b>📲 Telepítés iPhone-on</b><p style="text-align:left;line-height:1.8">1. Nyisd meg <b>Safariban</b><br>2. Koppints a <b>Megosztás</b> ⬆️ gombra<br>3. Válaszd: <b>Főképernyőhöz adás</b><br>4. Koppints: <b>Hozzáadás</b></p><button class="chip" id="iosx">Rendben</button></div></div>
<div class="toast" id="toast"></div>
<nav class="nav"><button data-a="home">🏠<small>Főoldal</small></button><button data-a="list">📚<small>Mesék</small></button><button data-a="mk">🧩<small>Alkotó</small></button><button data-a="wheel">🎡<small>Kerék</small></button><button data-a="night">🌙<small>Éjszaka</small></button><button data-a="share">🔗<small>Megosztás</small></button></nav>
<div class="modal" id="modal"><div class="box"><b id="mt">Oszd meg</b><div id="qr"></div><small id="lnk" style="word-break:break-all"></small><br><br><button class="chip" id="copy">Link másolása</button> <button class="chip" id="instShare" style="display:none">📲 Telepítés</button> <button class="chip" id="nat" style="display:none">Küldés</button> <button class="chip" id="close">Bezár</button></div></div>

<div class="modal" id="wheelModal"><div class="box" style="max-width:340px">
 <b style="font-size:20px">🎡 Szerencsekerék</b>
 <div class="wrap"><div class="ptr">▼</div><canvas id="wc" width="600" height="600"></canvas></div>
 <div id="wres"></div>
 <button class="play" id="spin" style="width:auto;padding:0 28px;border-radius:30px">Pörgess!</button>
 <button class="chip" id="wclose" style="margin-left:6px">Bezár</button></div></div>
<script src="qr.js"></script>
<script src="stories.js"></script>
<script src="stories-uj.js"></script>
<script src="stories-3.js"></script>
<script src="stories-hosszu.js"></script>
<script src="stories-grimm.js"></script>
<script src="stories-stilus.js"></script>
<script src="alkoto.js"></script>
<script>
const S=window.STORIES,$=id=>document.getElementById(id);
const CATS={all:"✨ Mind",esti:"🌙 Esti",nepmese:"📖 Népmese",allatos:"🐾 Állatos",own:"⭐ Saját",hosszu:"⏱ Hosszú (6+ perc)",tunderes:"🧚 Tündéres",kaland:"🧭 Kaland"};
let cat="all",cur=null,words=[],offs=[],spans=[],idx=0,speaking=false,timer=null,fs=1;

// Éjszakai mód: automatikus este, kézzel is váltható
const h=new Date().getHours();
let nd=null;try{nd=JSON.parse(localStorage.nightPref||"null")}catch(e){}
if((nd&&nd.d===new Date().toDateString())?nd.v:(h>=19||h<6))document.body.classList.add("night");
function themeMeta(){document.querySelector('meta[name=theme-color]').content=document.body.classList.contains("night")?"#16120f":"#fff7ec"}themeMeta();
window.toggleNight=()=>{document.body.classList.toggle("night");try{localStorage.nightPref=JSON.stringify({d:new Date().toDateString(),v:document.body.classList.contains("night")})}catch(e){}themeMeta()};

const grad=s=>`linear-gradient(135deg,${s.bg[0]},${s.bg[1]})`;
function daily(){const P=S.filter(x=>!x.custom),d=Math.floor(Date.now()/864e5),s=P[d%P.length];
 $("daily").style.background=grad(s);
 $("daily").innerHTML=`<div class="e">${s.emoji}</div><div><small>🌟 Mai esti mese</small><b>${s.title}</b><small>${s.min} perc</small></div>`;
 $("daily").onclick=()=>open(s.id)}
function chips(){$("chips").innerHTML=Object.entries(CATS).map(([k,v])=>`<button class="chip ${k==cat?"on":""}" data-k="${k}">${v}</button>`).join("");
 document.querySelectorAll(".chip[data-k]").forEach(b=>b.onclick=()=>{cat=b.dataset.k;chips();list()})}
function list(){const q=$("q").value.toLowerCase();
 $("grid").innerHTML=S.filter(s=>(cat=="all"||s.cat==cat||(cat=="hosszu"&&s.min>=6)||(cat=="own"&&s.custom))&&s.title.toLowerCase().includes(q)).map(s=>
 `<div class="card" data-id="${s.id}"><div class="img" style="background:${grad(s)}">${s.emoji}</div><div class="t">${s.title}<small>${s.min} perc</small></div></div>`).join("");
 document.querySelectorAll(".card").forEach(c=>c.onclick=()=>open(c.dataset.id))}
$("q").oninput=list;

function open(id){stop();cur=S.find(s=>s.id===id);if(!cur)return;
 if(history.state&&history.state.r)history.replaceState({r:1},"","#"+id);else history.pushState({r:1},"","#"+id);
 $("cover").style.background=grad(cur);$("cover").textContent=cur.emoji;
 words=[];let html=`<h2>${cur.title}</h2>`;
 cur.text.forEach(p=>{html+="<p>"+p.split(/\s+/).map(w=>{words.push(w);return `<span class="w">${w}</span>`}).join(" ")+"</p>"});
 html+=`<div class="end"><div style="font-size:48px">🌙</div><button class="chip" id="endBack">✓ Vége – vissza a menübe</button><br><button class="chip" id="endWheel">🎡 Másik mesét pörgetek</button></div>`;
 $("story").innerHTML=html;$("endBack").onclick=()=>closeReader();$("endWheel").onclick=()=>{closeReader();setTimeout(openWheel,400)};spans=[...document.querySelectorAll(".w")];
 let o=0;offs=words.map(w=>{const s=o;o+=w.length+1;return s});
 $("reader").classList.add("open");document.body.classList.add("lock");$("reader").scrollTop=0;idx=0;lm=-1}
function closeReader(fromPop){stop();if(window.pendingUpdate){hardRefresh();return}$("reader").classList.remove("open");document.body.classList.remove("lock");
 if(!fromPop){if(history.state&&history.state.r)history.back();else history.replaceState(null,"",location.pathname)}}
$("back").onclick=()=>closeReader();$("x").onclick=()=>closeReader();

// Felolvasás (böngésző beépített TTS, magyar hang)
let voices=[];
function loadVoices(){voices=speechSynthesis.getVoices().filter(v=>/^hu/i.test(v.lang));
 voices.sort((a,b)=>score(b)-score(a));
 $("voice").innerHTML=voices.length?voices.map((v,i)=>`<option value="${i}">${v.name.replace(/Microsoft |Google /,"")}</option>`).join(""):`<option>Nincs magyar hang</option>`}
const score=v=>(/natural|online|neural|google/i.test(v.name)?2:0)+(v.localService?0:1);
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
let userScroll=0;
["touchstart","wheel","pointerdown"].forEach(ev=>$("reader").addEventListener(ev,()=>userScroll=Date.now()+4000,{passive:true}));
let lm=-1;
function mark(i){if(lm<0||i<lm)spans.forEach((s,k)=>{s.classList.toggle("r",k<i);s.classList.toggle("now",k===i)});
 else for(let k=lm;k<=i&&k<spans.length;k++){spans[k].classList.toggle("r",k<i);spans[k].classList.toggle("now",k===i)}
 lm=i;
 const el=spans[i],R=$("reader");if(!el||Date.now()<userScroll)return;
 const r=el.getBoundingClientRect();
 if(r.bottom>innerHeight-170||r.top<110)R.scrollTo({top:el.offsetTop-R.clientHeight*0.35,behavior:"smooth"})}
let gen=0,sleepAt=0,sli=0;const SL=[0,15,30,45];
function speak(){if(!("speechSynthesis" in window))return alert("Ez a böngésző nem tud felolvasni.");
 speechSynthesis.cancel();speaking=true;gen++;$("play").textContent="⏸";run(idx,gen)}
function run(start,g){if(!speaking||g!==gen)return;
 if(sleepAt&&Date.now()>=sleepAt){stop();sleepAt=0;sli=0;$("sl").textContent="😴";toast("Jó éjszakát 🌙");return}
 if(start>=words.length){mark(words.length);stop(true);return}
 const end=Math.min(words.length,start+28),seg=words.slice(start,end),so=[];let o=0;seg.forEach(w=>{so.push(o);o+=w.length+1});
 const u=new SpeechSynthesisUtterance(seg.join(" "));u.lang="hu-HU";u.rate=+$("rate").value;u.pitch=1.05;
 if(sleepAt)u.volume=Math.max(.2,Math.min(1,(sleepAt-Date.now())/12e4));
 if(voices[$("voice").value])u.voice=voices[$("voice").value];
 let gotB=false,k=0;const t0=Date.now();
 u.onboundary=e=>{gotB=true;let i=so.findIndex((s,j)=>s<=e.charIndex&&e.charIndex<=s+seg[j].length);if(i<0)i=k;k=i;idx=start+i;mark(idx)};
 u.onend=()=>{if(g===gen)run(end,g)};
 u.onerror=e=>{if(g!==gen||e.error==="interrupted"||e.error==="canceled")return;stop();toast("A felolvasás nem sikerült – nézd meg a hangbeállításokat")};
 clearInterval(timer);
 timer=setInterval(()=>{if(gotB||g!==gen)return;if(Date.now()-t0>1200){k=Math.min(k+1,seg.length-1);idx=start+k;mark(idx)}},Math.round(430/u.rate));
 speechSynthesis.speak(u)}
$("sl").onclick=()=>{sli=(sli+1)%SL.length;if(SL[sli]){sleepAt=Date.now()+SL[sli]*6e4;$("sl").textContent="😴 "+SL[sli];toast("Elalvás-időzítő: "+SL[sli]+" perc, a hang fokozatosan halkul")}else{sleepAt=0;$("sl").textContent="😴"}};
function stop(done){gen++;speaking=false;clearInterval(timer);if("speechSynthesis" in window)speechSynthesis.cancel();$("play").textContent="▶";if(done===true)idx=0}
$("play").onclick=()=>speaking?stop():speak();
$("rate").onchange=()=>{if(speaking)speak()};$("voice").onchange=()=>{if(speaking)speak()};
$("fs").onclick=()=>{fs=fs>=1.4?0.9:fs+0.2;document.documentElement.style.setProperty("--fs",fs)};

// Megosztás: link + QR
function shareText(){const tx=cur.title+"\n\n"+cur.text.join("\n\n");
 if(navigator.share)navigator.share({title:cur.title,text:tx}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(tx);toast("A mese szövege a vágólapra másolva")}}
function showShare(url,title){$("mt").textContent=title;$("lnk").textContent=url;$("qr").innerHTML="";drawQR($("qr"),url,200);
 $("copy").textContent="Link másolása";$("instShare").style.display=standalone?"none":"inline-block";$("modal").classList.add("open");
 $("copy").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(url);$("copy").textContent="Másolva ✓"};
 $("nat").style.display=navigator.share?"inline-block":"none";
 $("nat").onclick=()=>navigator.share({title:"2mese és alvás",text:title,url}).catch(()=>{})}
$("share").onclick=()=>cur.custom?shareText():showShare(location.origin+location.pathname+"#"+cur.id,"Oszd meg a mesét: "+cur.title);
window.homeShare=()=>showShare(location.origin+location.pathname,"Oszd meg a 2mese és alvás appot");
$("close").onclick=()=>$("modal").classList.remove("open");

// Szerencsekerék
let wAng=0,wSegs=[],spinning=false,actx,lastIdx=-1;
const COL=["#ff8a5c","#ffd166","#6fcf97","#56ccf2","#bb86fc","#ff7eb6","#f2c94c","#4db6ac"];
function snd(f,d=.08,type="sine",v=.2){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain(),n=actx.currentTime;o.type=type;o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.start(n);o.stop(n+d)}catch(e){}}
function wIdx(){const a=2*Math.PI/wSegs.length;return Math.floor((((-Math.PI/2-wAng)%(2*Math.PI))+2*Math.PI)%(2*Math.PI)/a)}
function drawWheel(){const c=$("wc"),x=c.getContext("2d"),n=wSegs.length,a=2*Math.PI/n,r=c.width/2;
 x.clearRect(0,0,c.width,c.height);x.save();x.translate(r,r);
 wSegs.forEach((s,i)=>{x.beginPath();x.moveTo(0,0);x.arc(0,0,r-8,i*a,(i+1)*a);x.fillStyle=COL[i%COL.length];x.fill();x.strokeStyle="#fff";x.lineWidth=6;x.stroke();
  x.save();x.rotate(i*a+a/2);x.font="84px sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText(s.emoji,r*0.62,0);x.restore()});
 x.beginPath();x.arc(0,0,34,0,7);x.fillStyle="#fff";x.fill();x.restore()}
function openWheel(){const pool=[...S].sort(()=>Math.random()-.5);wSegs=pool.slice(0,8);wAng=Math.random()*6;$("wc").style.transform=`rotate(${wAng}rad)`;$("wres").innerHTML="Pörgesd meg, és kiderül, melyik mesét hallgatjuk meg!";drawWheel();$("wheelModal").classList.add("open")}
function spin(){if(spinning)return;spinning=true;$("wres").innerHTML="🎶";$("spin").disabled=true;
 const start=wAng,total=(5+Math.random()*3)*2*Math.PI,dur=4800,t0=performance.now();lastIdx=wIdx();
 (function f(now){const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);wAng=start+total*e;$("wc").style.transform=`rotate(${wAng}rad)`;
  const i=wIdx();if(i!==lastIdx){lastIdx=i;snd(500+Math.random()*120,.05,"triangle",.25)}
  if(p<1)return requestAnimationFrame(f);
  spinning=false;$("spin").disabled=false;$("spin").textContent="Még egyszer!";
  const s=wSegs[wIdx()];[523,659,784,1047].forEach((q,k)=>setTimeout(()=>snd(q,.3,"sine",.25),k*140));
  $("wres").innerHTML=`<div class="e">${s.emoji}</div>${s.title}<br><button class="chip" id="go" style="margin-top:8px;background:var(--pri);color:#fff">📖 Mehet a mese!</button>`;
  $("go").onclick=()=>{$("wheelModal").classList.remove("open");open(s.id)};
  try{const u=new SpeechSynthesisUtterance("A mai mese: "+s.title);u.lang="hu-HU";speechSynthesis.speak(u)}catch(e){}
 })(t0)}
$("spin").onclick=spin;
$("wclose").onclick=()=>{try{speechSynthesis.cancel()}catch(e){}$("wheelModal").classList.remove("open")};
window.onpopstate=()=>{window.alkotoPop&&alkotoPop();if($("reader").classList.contains("open"))closeReader(true);$("modal").classList.remove("open");$("wheelModal").classList.remove("open")};
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>({
 home:()=>{cat="all";$("q").value="";chips();list();scrollTo({top:0,behavior:"smooth"})},
 list:()=>$("chips").scrollIntoView({behavior:"smooth",block:"start"}),
 wheel:openWheel,mk:()=>openCreator(),night:()=>window.toggleNight(),share:()=>window.homeShare()})[b.dataset.a]());
// Frissítés: kézi gomb + automatikus ellenőrzés
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),3200)}
async function hardRefresh(){try{for(const k of await caches.keys())await caches.delete(k);const r=await navigator.serviceWorker.getRegistration();r&&await r.update()}catch(e){}location.reload()}
async function checkUpdate(manual){
 if(manual)$("upd").classList.add("spin");
 try{const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const j=await r.json(),v=String(j.v),old=localStorage.getItem("mv");
  localStorage.setItem("mv",v);
  if(manual||(old!==null&&old!==v)){
   if(!manual&&$("reader").classList.contains("open")){window.pendingUpdate=true;toast("Új mesék érkeztek – a mese végén frissítek ✨");return}
   toast("Frissítés…");setTimeout(hardRefresh,500);return}
 }catch(e){if(manual)toast("Nincs internet – az offline változat fut")}
 $("upd").classList.remove("spin")}
$("upd").onclick=()=>checkUpdate(true);
// Telepítés (Android: natív kérés, iOS: útmutató)
let dip=null;const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function snoozed(){try{return Date.now()-(+localStorage.instNo||0)<6048e5}catch(e){return false}}
function maybeInstall(force){if(standalone||(!force&&snoozed()))return;$("install").classList.add("on")}
function hideInstall(s){$("install").classList.remove("on");if(s)try{localStorage.instNo=Date.now()}catch(e){}}
async function doInstall(){if(dip){dip.prompt();try{await dip.userChoice}catch(e){}dip=null;hideInstall();return}
 if(ios)$("iosm").classList.add("open");else toast("Chrome menü (⋮) → Alkalmazás telepítése")}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dip=e;maybeInstall(location.hash.length>1)});
window.addEventListener("appinstalled",()=>hideInstall());
if(ios)setTimeout(()=>maybeInstall(location.hash.length>1),2500);
$("instBtn").onclick=doInstall;$("instX").onclick=()=>hideInstall(true);$("iosx").onclick=()=>$("iosm").classList.remove("open");
$("instShare").onclick=()=>{$("modal").classList.remove("open");doInstall()};
if('serviceWorker' in navigator){
 const had=!!navigator.serviceWorker.controller;let rl=false;
 navigator.serviceWorker.register('sw.js');
 navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!had||rl)return;rl=true;if($("reader").classList.contains("open")){window.pendingUpdate=true;toast("Új verzió kész – a mese végén frissítek ✨")}else location.reload()})}
checkUpdate(false);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkUpdate(false)});
setInterval(()=>{if(!document.hidden)checkUpdate(false)},30*60*1000);
daily();chips();list();
if(location.hash.length>1)open(location.hash.slice(1));
</script>
